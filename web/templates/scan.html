<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse média — Station Blanche</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="page-scan">
  <main class="container">
    <header class="header">
      <a href="/" class="back-link">← Accueil</a>
      <h1>Analyse de média</h1>
      <p class="subtitle">Clés USB, disques externes — NTFS, exFAT, ext4, FAT32</p>
    </header>

    <section id="scanners-info" class="scanners-banner">
      <span id="scanners-list">Moteurs : chargement...</span>
      <span id="current-scanner" class="current-scanner"></span>
    </section>

    <section class="media-panel">
      <div class="media-panel-header">
        <h2>Médias détectés</h2>
        <button id="btn-refresh-media" class="btn btn-primary">Actualiser la liste</button>
      </div>
      <p id="media-hint" class="muted">Branchez un média puis cliquez sur Actualiser.</p>
      <div id="media-list" class="media-list">
        <p class="muted">Chargement...</p>
      </div>
    </section>

    <section id="status-panel" class="status-panel status-waiting">
      <div id="status-icon" class="status-icon">⏳</div>
      <p id="status-message" class="status-message">Sélectionnez un média à analyser.</p>
      <div id="progress-container" class="progress-container hidden">
        <div class="progress-header">
          <span id="progress-label" class="progress-label">Analyse en cours...</span>
          <span id="progress-percent" class="progress-percent">0 %</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
        <button id="btn-cancel-scan" type="button" class="btn btn-danger btn-cancel-scan">Annuler l'analyse</button>
      </div>
    </section>

    <section class="log-panel">
      <h2>Journal d'analyse</h2>
      <pre id="scan-log" class="scan-log"></pre>
    </section>
  </main>
  <script src="/static/js/scan.js"></script>
</body>
</html>
